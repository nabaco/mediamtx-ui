# Add this to your mediamtx.yml to enable the mediamtx-ui auth callback.
# Replace MEDIAMTX_UI_HOST with the hostname/IP where mediamtx-ui is running.
# Port 9996 is the default mediamtx-ui port.
#
# With this config, ALL stream access (RTSP/HLS/WebRTC/RTMP/SRT) is
# authenticated by mediamtx-ui using its SQLite ACL database.

authMethod: http
authHTTPAddress: http://MEDIAMTX_UI_HOST:9996/api/v1/mediamtx/auth

# If mediamtx-ui is on the same Docker/Podman network:
# authHTTPAddress: http://mediamtx-ui:9996/api/v1/mediamtx/auth

# Control-plane access (mediamtx >= 1.20.1):
# authHTTPExclude now defaults to [] so the api / metrics / pprof actions are
# sent to the callback as well. mediamtx-ui allows them ONLY for the service
# account it uses itself (mediamtx.api_user / mediamtx.api_pass, i.e.
# MEDIAMTX_UI_MEDIAMTX_API_USER / _API_PASS); UI users, admins included, are
# denied. Keep authHTTPExclude empty: excluding `api` would leave the mediamtx
# API unauthenticated (that was the pre-1.20.1 default).
#
# To let specific clients skip the callback (e.g. local publishers):
# authHTTPExclude:
#   - action: publish
#     ips: [127.0.0.1]
